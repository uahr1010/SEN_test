# ============================================================================
#  용어집 컴파일 — content/glossary/*.json (Pages CMS [④ 용어집]이 항목
#  하나당 파일 하나로 관리하는 원본) 이 바뀔 때마다, 번역 도구가 읽는
#  content/glossary.json 하나로 다시 합쳐 커밋합니다.
#
#  GitHub Pages는 정적 호스팅이라 폴더 안 파일 목록을 브라우저가 알아낼
#  방법이 없어서, 커밋될 때 미리 하나로 묶어 둡니다 — Pages CMS에서 용어를
#  추가/삭제/수정하면 자동으로 돌아가고, 따로 손댈 필요 없습니다.
# ============================================================================
name: 용어집 컴파일

on:
  push:
    branches: [main]
    paths:
      - 'content/glossary/**'
      - 'tools/compile_glossary.py'
  workflow_dispatch: {}

# content/glossary.json 을 고쳐 커밋해야 하므로 쓰기 권한이 필요합니다
permissions:
  contents: write

# 용어가 연달아 올라와도 커밋이 꼬이지 않도록 한 번에 하나씩
concurrency:
  group: compile-glossary
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 컴파일
        run: python tools/compile_glossary.py

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/glossary.json
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없습니다."
            exit 0
          fi
          git commit -m "chore: 용어집 자동 컴파일 [skip ci]"

          # Pages CMS가 같은 타이밍에 main에 바로 커밋을 넣을 수 있어서
          # (용어를 여러 개 빠르게 지우거나 저장할 때 특히), push가 그
          # 사이 밀린 커밋 때문에 거절될 수 있습니다. 실패하면 새로 받아
          # rebase 하고 다시 시도합니다.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push 실패 — 새 커밋을 받아 다시 시도합니다 ($i/5)"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::여러 번 재시도했지만 push에 계속 실패했습니다."
          exit 1
