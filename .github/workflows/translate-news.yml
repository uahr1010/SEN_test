# ============================================================================
#  한국어 기사 초안 → 4개 국어 번역 → content/news.json 자동 반영
#
#  drafts/ 폴더에 .md 파일을 올리면 (Pages CMS 로 써도 됩니다) 이 작업이
#  자동으로 돌아 번역 결과를 news.json 에 커밋합니다.
#  Actions 탭에서 "Run workflow" 로 손수 돌릴 수도 있습니다.
#
#  API 키는 저장소 Settings → Secrets and variables → Actions →
#  Repository secrets 의 OPENAI_API_KEY 에서 가져옵니다.
#  이 값은 GitHub 서버 안에서만 풀리며, 공개 저장소라도 외부에 노출되지 않습니다.
#  로그에도 자동으로 가려집니다(***).
# ============================================================================
name: 기사 번역

on:
  push:
    paths:
      - 'drafts/**.md'
      - '!drafts/README.md'
  workflow_dispatch:
    inputs:
      draft:
        description: '번역할 초안 파일 경로 (예 drafts/2026-08-12-세미나.md)'
        required: true
        type: string

# news.json 을 고쳐 커밋해야 하므로 쓰기 권한이 필요합니다
permissions:
  contents: write

# 여러 초안이 연달아 올라와도 커밋이 꼬이지 않도록 한 번에 하나씩
concurrency:
  group: translate-news
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install --quiet openai

      - name: 번역할 초안 정하기
        id: pick
        env:
          MANUAL: ${{ inputs.draft }}
        run: |
          if [ -n "$MANUAL" ]; then
            files="$MANUAL"
          else
            # 이번 push 에서 추가·수정된 drafts/*.md 만 고릅니다
            files=$(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} -- 'drafts/*.md' | grep -v 'drafts/README.md' || true)
          fi
          if [ -z "$files" ]; then
            echo "번역할 초안이 없습니다."
            echo "found=" >> "$GITHUB_OUTPUT"
          else
            echo "대상:"; echo "$files"
            { echo "found<<EOF"; echo "$files"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi

      - name: 번역
        if: steps.pick.outputs.found != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEN_TRANSLATE_MODEL: ${{ vars.SEN_TRANSLATE_MODEL }}
          SEN_TRANSLATE_BASE_URL: ${{ vars.SEN_TRANSLATE_BASE_URL }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY 시크릿이 없습니다. Settings → Secrets and variables → Actions 에 등록하세요."
            exit 1
          fi
          echo "${{ steps.pick.outputs.found }}" | while read -r f; do
            [ -z "$f" ] && continue
            echo "::group::$f"
            python tools/translate_news.py "$f"
            echo "::endgroup::"
          done

      - name: 초안 정리 후 커밋
        if: steps.pick.outputs.found != ''
        run: |
          # 번역이 끝난 초안은 지웁니다 (원문은 news.json 의 ko 에 남습니다)
          echo "${{ steps.pick.outputs.found }}" | while read -r f; do
            [ -n "$f" ] && rm -f "$f"
          done

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/news.json drafts
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없습니다."
          else
            git commit -m "chore: 기사 번역 자동 반영 [skip ci]"
            git push
          fi
