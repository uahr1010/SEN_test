# ============================================================================
#  기사 번역 — Pages CMS [② 뉴스 번역] 페이지의 "번역 실행" 버튼으로 돌립니다
#  (.pages.yml 의 news-i18n.actions). 버튼을 누르면 번역할 기사의 "고유 ID"를
#  물어보고, 그 값이 이 워크플로의 payload 입력(inputs.news_id)으로 넘어와
#  tools/translate_by_id.py 가 처리합니다.
#
#  글 자체는 [① 뉴스]에 한국어로 먼저 올려 둡니다. content/news-i18n.json 에
#  번역을 기록하고 커밋합니다 — 결과는 [② 뉴스 번역] 탭에 나타납니다.
#
#  버튼이 안 되거나 저장소 화면에서 직접 돌리고 싶으면, Actions 탭 →
#  "기사 번역" → Run workflow → news_id 칸에 "고유 ID"를 적고 실행해도
#  결과는 같습니다(payload 대신 news_id 입력을 바로 받는 경로).
#
#  API 키는 저장소 Settings → Secrets and variables → Actions →
#  Repository secrets 의 OPENAI_API_KEY 에서 가져옵니다.
#  이 값은 GitHub 서버 안에서만 풀리며, 공개 저장소라도 외부에 노출되지 않습니다.
#  로그에도 자동으로 가려집니다(***). Pages CMS나 브라우저에는 전혀 전달되지
#  않습니다 — 버튼은 워크플로만 "실행하라"고 GitHub에 신호를 보낼 뿐입니다.
# ============================================================================
name: 기사 번역

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Pages CMS가 자동으로 채웁니다 (entry action payload, JSON)'
        required: false
        type: string
      news_id:
        description: 'Actions 탭에서 손으로 돌릴 때만 — 번역할 기사의 고유 ID'
        required: false
        type: string

# content/news.json 을 고쳐 커밋해야 하므로 쓰기 권한이 필요합니다
permissions:
  contents: write

# 여러 요청이 겹쳐 들어와도 커밋이 꼬이지 않도록 한 번에 하나씩
concurrency:
  group: translate-queue
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install --quiet openai

      - name: 번역
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEN_TRANSLATE_MODEL: ${{ vars.SEN_TRANSLATE_MODEL }}
          SEN_TRANSLATE_BASE_URL: ${{ vars.SEN_TRANSLATE_BASE_URL }}
          PAYLOAD: ${{ inputs.payload }}
          NEWS_ID: ${{ inputs.news_id }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY 시크릿이 없습니다. Settings → Secrets and variables → Actions 에 등록하세요."
            exit 1
          fi
          if [ -n "$NEWS_ID" ]; then
            python tools/translate_by_id.py --news-id "$NEWS_ID"
          elif [ -n "$PAYLOAD" ]; then
            python tools/translate_by_id.py --payload "$PAYLOAD"
          else
            echo "::error::payload 도 news_id 도 없습니다."
            exit 1
          fi

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/news-i18n.json
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없습니다."
            exit 0
          fi
          git commit -m "chore: 기사 번역 자동 반영 [skip ci]"

          # Pages CMS나 다른 자동 커밋(뉴스 목록 컴파일 등)이 같은 타이밍에
          # main에 커밋을 넣을 수 있어서, push가 그 사이 밀린 커밋 때문에
          # 거절될 수 있습니다. 실패하면 새로 받아 rebase 하고 재시도합니다.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push 실패 — 새 커밋을 받아 다시 시도합니다 ($i/5)"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::여러 번 재시도했지만 push에 계속 실패했습니다."
          exit 1
