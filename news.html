<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEN Engineering Group</title>
<meta name="description" content="SEN Engineering Group 뉴스">
<meta property="og:type" content="article">
<meta property="og:title" content="SEN Engineering Group">
<meta property="og:image" content="assets/img/intro-poster.jpg">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

<!-- 웹폰트: index.html 과 동일 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/atlas.css">
</head>
<body>

<!-- ============ 상단 고정 네비 ============
     index.html 의 <header class="topbar"> 와 마크업이 동일해야 합니다.
     다른 점은 딱 두 가지뿐입니다.
       · 메뉴가 <button data-scene> 대신 index.html#섹션id 로 가는 <a> 입니다
         (이 페이지에는 스크롤로 넘어갈 .scene 이 없어서 다른 페이지로 이동해야 합니다)
       · 인트로 위에 뜰 일이 없으므로 처음부터 class="is-light" 를 붙여 둡니다 -->
<header class="topbar is-light">
  <a class="topbar__logo" href="index.html">
    <img src="assets/img/logo.png" alt="SEN Engineering Group" width="471" height="110">
  </a>

  <nav class="topnav" aria-label="주 메뉴">
    <a href="index.html#scene-about" data-bind="site.nav.about">회사소개</a>
    <a href="index.html#scene-projects" data-bind="site.nav.projects">프로젝트</a>
    <a href="index.html#scene-news" data-bind="site.nav.news">뉴스</a>
    <a href="index.html#scene-careers" data-bind="site.nav.careers">채용</a>
  </nav>

  <div class="lang" data-langswitch>
    <button class="lang__btn" type="button" aria-haspopup="true" aria-expanded="false" data-lang-toggle>
      <svg class="ico" width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.6 10h14.8M10 2.6c4 4.6 4 10.8 0 14.8M10 2.6c-4 4.6-4 10.8 0 14.8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      <span data-lang-current>KO</span>
    </button>
    <ul class="lang__menu" data-lang-menu role="menu">
      <li><button type="button" data-lang="ko" role="menuitem">한국어</button></li>
      <li><button type="button" data-lang="en" role="menuitem">English</button></li>
      <li><button type="button" data-lang="zh" role="menuitem">中文</button></li>
      <li><button type="button" data-lang="ja" role="menuitem">日本語</button></li>
    </ul>
  </div>
</header>

<main class="article-main">
  <div class="article">
    <a class="article__back" href="index.html#scene-news" data-bind="site.ui.backToNews">← 뉴스 목록으로</a>
    <div data-article><p class="article__empty">불러오는 중…</p></div>
  </div>
</main>

<!-- ============ 공용 푸터 ============
     index.html 의 <footer class="site-footer"> 와 마크업이 완전히 동일합니다. -->
<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__brand">
      <img src="assets/img/logo.png" alt="SEN Engineering Group" width="471" height="110">
    </div>
    <div class="site-footer__info">
      <p data-bind="site.footer.address"></p>
      <p data-bind="site.footer.tel"></p>
      <p class="site-footer__copy" data-bind="site.footer.copyright"></p>
    </div>
  </div>
</footer>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/atlas.js"></script>
<script src="assets/js/news-detail.js"></script>

</body>
</html>
