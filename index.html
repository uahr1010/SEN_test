<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEN Engineering Group</title>
<meta name="description" content="1973년부터 이어온 건축구조 원스톱 엔지니어링. PSRC · TSC 선조립 합성구조 공법.">
<meta property="og:type" content="website">
<meta property="og:title" content="SEN Engineering Group">
<meta property="og:description" content="1973년부터 이어온 건축구조 원스톱 엔지니어링.">
<meta property="og:image" content="assets/img/intro-poster.jpg">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

<!-- 웹폰트: 필요 없으면 아래 블록을 통째로 지우면 됩니다 (시스템 폰트로 자동 대체) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<!-- base/components 는 섹션 안쪽 내용(카드·타임라인·채용 아코디언)용,
     atlas 는 시네마틱 껍데기(고정 무대·장면 전환·상단 네비)용입니다.
     atlas 가 뒤에 와야 팔레트를 덮어씁니다. -->
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/atlas.css">

</head>
<body>

<!-- ============ 상단 고정 네비 ============ -->
<header class="topbar">
  <div class="topbar__logo">
    <strong data-bind="site.company.shortName">SEN</strong>
    <em data-bind="site.company.name">Engineering Group</em>
  </div>

  <nav class="topnav" aria-label="주 메뉴">
    <button type="button" data-scene="1" data-bind="site.nav.about">회사소개</button>
    <button type="button" data-scene="2" data-bind="site.nav.projects">프로젝트</button>
    <button type="button" data-scene="3" data-bind="site.nav.news">뉴스</button>
    <button type="button" data-scene="4" data-bind="site.nav.careers">채용</button>
  </nav>

  <div class="lang" data-langswitch>
    <button class="lang__btn" type="button" aria-haspopup="true" aria-expanded="false" data-lang-toggle>
      <svg class="ico" width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.6 10h14.8M10 2.6c4 4.6 4 10.8 0 14.8M10 2.6c-4 4.6-4 10.8 0 14.8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      <span data-lang-current>KO</span>
    </button>
    <ul class="lang__menu" data-lang-menu role="menu">
      <li><button type="button" data-lang="ko" role="menuitem">한국어</button></li>
      <li><button type="button" data-lang="en" role="menuitem">English</button></li>
      <li><button type="button" data-lang="zh" role="menuitem">中文</button></li>
      <li><button type="button" data-lang="ja" role="menuitem">日本語</button></li>
    </ul>
  </div>
</header>

<nav id="prog" aria-label="장면 이동"></nav>

<main id="top">

  <!-- ---------- 장면 0 : 인트로 영상 ---------- -->
  <section class="scene scene--dark" id="scene-intro" data-label="인트로">
    <div class="intro__media">
      <img class="intro__poster" src="assets/img/intro-poster.jpg" alt="" fetchpriority="high">
      <div class="intro__vignette"></div>
    </div>
    <div class="intro__hud">
      <div>
        <h1 class="intro__title">SEN<br><span class="thin">ENGINEERING</span></h1>
        <p class="intro__sub" data-bind="site.hero.eyebrow"></p>
      </div>
    </div>
    <div class="intro__cue"><span>SCROLL</span><i></i></div>
  </section>

  <!-- ---------- 장면 1 : 회사소개 ---------- -->
  <section class="scene scene--paper" id="scene-about" data-label="회사소개">
    <div class="scene__inner">
      <header class="scene__head">
        <p class="scene__kicker" data-bind="about.section.eyebrow"></p>
        <h2 class="scene__title" data-bind="about.section.title"></h2>
        <p class="scene__lead" data-bind="about.section.lead"></p>
      </header>

      <div class="about-block" id="about-ceo">
        <div class="about-grid">
          <div class="ceo__media"><img data-src="about.ceo.photo" alt="" loading="lazy"></div>
          <div>
            <h3 class="block__title" data-bind="about.ceo.heading"></h3>
            <blockquote class="ceo__quote" data-bind="about.ceo.quote"></blockquote>
            <div class="scene__scroll">
              <div class="prose" data-prose="about.ceo.body"></div>
              <details class="ceo__career">
                <summary data-bind="about.ceo.careerLabel"></summary>
                <ul data-list="about.ceo.career"></ul>
              </details>
            </div>
            <p class="ceo__sign">
              <span class="ceo__role" data-bind="about.ceo.role"></span>
              <strong class="ceo__name" data-bind="about.ceo.name"></strong>
            </p>
          </div>
        </div>
      </div>

      <div class="about-block" id="about-history">
        <h3 class="block__title" data-bind="about.history.heading"></h3>
        <p class="scene__lead" data-bind="about.history.lead"></p>
        <div class="scene__scroll"><div class="timeline" data-list="about.history.items"></div></div>
      </div>

      <div class="about-block" id="about-methods">
        <h3 class="block__title" data-bind="about.methods.heading"></h3>
        <p class="scene__lead" data-bind="about.methods.lead"></p>
        <div class="scene__scroll"><div class="methods" data-list="about.methods.items"></div></div>
      </div>

      <div class="about-block" id="about-contact">
        <h3 class="block__title" data-bind="about.contact.heading"></h3>
        <p class="scene__lead" data-bind="about.contact.lead"></p>
        <div class="scene__scroll"><div class="offices" data-list="about.contact.offices"></div></div>
      </div>
    </div>
  </section>

  <!-- ---------- 장면 2 : 프로젝트 (실적 지구본) ---------- -->
  <section class="scene scene--paper" id="scene-projects" data-label="프로젝트" data-section="projects">
    <div class="scene__inner">
      <header class="scene__head">
        <p class="scene__kicker" data-bind="projects.section.eyebrow"></p>
        <h2 class="scene__title" data-bind="projects.section.title"></h2>
        <p class="scene__lead" data-bind="projects.section.lead"></p>
      </header>

      <div class="about-grid">
        <div>
          <dl class="globe__stats" data-globe-stats></dl>
          <div class="scene__scroll"><ol class="regions" data-region-list></ol></div>
        </div>
        <div class="globe">
          <div class="globe__stage" data-globe>
            <div class="globe__pills" data-globe-pills aria-hidden="true"></div>
            <div class="globe__tip" data-globe-tip hidden></div>
          </div>
          <p class="globe__hint" data-globe-hint></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ---------- 장면 3 : 뉴스 ---------- -->
  <section class="scene scene--paper" id="scene-news" data-label="뉴스" data-section="news">
    <div class="scene__inner">
      <header class="scene__head">
        <p class="scene__kicker" data-bind="news.section.eyebrow"></p>
        <h2 class="scene__title" data-bind="news.section.title"></h2>
        <p class="scene__lead" data-bind="news.section.lead"></p>
      </header>
      <div class="chips" data-newsfilter></div>
      <div class="scene__scroll">
        <div class="cards cards--news" data-list="news.items"></div>
        <div class="more">
          <button class="btn btn--ghost" type="button" data-more="news" data-bind="site.ui.loadMore"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- ---------- 장면 4 : 채용 ---------- -->
  <section class="scene scene--paper" id="scene-careers" data-label="채용" data-section="careers">
    <div class="scene__inner">
      <header class="scene__head">
        <p class="scene__kicker" data-bind="careers.section.eyebrow"></p>
        <h2 class="scene__title" data-bind="careers.section.title"></h2>
        <p class="scene__lead" data-bind="careers.section.lead"></p>
      </header>
      <div class="values" data-list="careers.values"></div>
      <h3 class="block__title" data-bind="careers.jobsHeading"></h3>
      <div class="scene__scroll">
        <div class="jobs" data-list="careers.jobs"></div>
        <h3 class="block__title" data-bind="careers.processHeading"></h3>
        <ol class="process" data-list="careers.process"></ol>
        <p class="scene__lead">
          <span data-bind="site.footer.address"></span> ·
          <span data-bind="site.footer.tel"></span><br>
          <small data-bind="site.footer.copyright"></small>
        </p>
      </div>
    </div>
  </section>

</main>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/projects.js"></script>
<script src="assets/js/globe.js"></script>
<script src="assets/js/controls.js"></script>
<script src="assets/js/atlas.js"></script>
<script src="assets/js/main.js"></script>

</body>
</html>
