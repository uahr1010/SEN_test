<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Senkuzo / SEN Engineering Group</title>
<meta name="description" content="1973년부터 이어온 건축구조 원스톱 엔지니어링. PSRC · TSC 선조립 합성구조 공법.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://github.senkuzo.com/">
<meta property="og:title" content="Senkuzo / SEN Engineering Group">
<meta property="og:description" content="1973년부터 이어온 건축구조 원스톱 엔지니어링.">
<!-- 표지 화면(사진+비전 문구+그룹명)을 합성해 만든 정적 썸네일입니다.
     크롤러는 JS를 실행하지 않아 실제 표지 화면을 그대로 가져올 수 없어서,
     assets/img/og-cover.jpg?v=93a6f4af 로 미리 만들어 둡니다. -->
<meta property="og:image" content="https://github.senkuzo.com/assets/img/og-cover.jpg?v=93a6f4af">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Senkuzo / SEN Engineering Group">
<meta name="twitter:description" content="1973년부터 이어온 건축구조 원스톱 엔지니어링.">
<meta name="twitter:image" content="https://github.senkuzo.com/assets/img/og-cover.jpg?v=93a6f4af">
<link rel="icon" href="assets/img/favicon.png" type="image/png">

<!-- 웹폰트 Noto Sans KR: 필요 없으면 아래 블록을 통째로 지우면 됩니다 (시스템 폰트로 자동 대체).
     100~900 가변 폰트라 굵기 하나로 본문(400)부터 로고(900)까지 모두 커버합니다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap">
<!-- 표지(첫 화면) 전용 폰트 — 비전 문구(Newsreader)·그룹명(Anton) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap">

<!-- 프로젝트(국내) 지도 — 실제 지도 타일 위에 현장을 점으로 찍습니다.
     API 키·결제수단 필요 없음(CARTO 무료 타일 + MapLibre 오픈소스). -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<!-- base/components 는 섹션 안쪽 내용(카드·타임라인·채용 아코디언)용,
     atlas 는 시네마틱 껍데기(고정 무대·장면 전환·상단 네비)용입니다.
     atlas 가 뒤에 와야 팔레트를 덮어씁니다. -->
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/atlas.css">

</head>
<body>

<!-- ============ 상단 고정 네비 ============
     로고·언어만 남기고 4개 메뉴는 없앴습니다. 배경은 항상 투명 유지
     (atlas.css .topbar — 더는 .is-light 로 흰 배경으로 안 바뀝니다). -->
<header class="topbar">
  <a class="topbar__logo" href="index.html">
    <img src="assets/img/logo.png" alt="SEN Engineering Group" width="471" height="110">
  </a>

  <div class="lang" data-langswitch>
    <button class="lang__btn" type="button" aria-haspopup="true" aria-expanded="false" data-lang-toggle>
      <svg class="ico" width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.6 10h14.8M10 2.6c4 4.6 4 10.8 0 14.8M10 2.6c-4 4.6-4 10.8 0 14.8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      <span data-lang-current>KO</span>
    </button>
    <ul class="lang__menu" data-lang-menu role="menu">
      <li><button type="button" data-lang="ko" role="menuitem">한국어</button></li>
      <li><button type="button" data-lang="en" role="menuitem">English</button></li>
      <li><button type="button" data-lang="zh" role="menuitem">中文</button></li>
      <li><button type="button" data-lang="ja" role="menuitem">日本語</button></li>
    </ul>
  </div>
</header>

<nav id="prog" aria-label="장면 이동"></nav>

<!-- ============ 표지 (첫 화면) ============
     본문(main) 앞에 배경처럼 고정되어 있다가, 스크롤하면 아래(main)가
     이 위로 슬라이드해 올라와 덮습니다. Pages CMS [③ 표지 사진]에
     등록된 사진들이 순서대로 서서히 교차 전환됩니다(assets/js/cover.js
     가 content/cover-photos.json을 읽어 타이밍을 계산해 넣습니다).
     사진마다 제목을 넣으면 SEN ENGINEERING GROUP 글자 바로 위에
     같은 타이밍으로 함께 전환됩니다(.cover__photo-titles). -->
<section class="cover" data-cover>
  <div class="cover__bg" data-cover-bg></div>
  <div class="cover__veil"></div>

  <p class="cover__vision" data-bind="site.hero.coverVision"></p>

  <div></div>

  <div class="cover__foot">
    <div class="cover__row">
      <span class="cover__cue"><i></i>SCROLL</span>
    </div>
    <div class="cover__photo-titles" data-cover-photo-titles aria-hidden="true"></div>
    <span class="cover__brand" data-cover-brand><span class="cover__brand-accent">SEN</span> ENGINEERING GROUP</span>
  </div>
</section>

<main id="top">

  <!-- ---------- 장면 0 : 인트로 (텍스트 플립) ----------
       assets/js/hero.js 가 단어 교체 애니메이션과 채용/뉴스 배지를 그립니다.
       배지 상태는 실제 데이터 기준(careers.jobs 개수, news.items 개수)입니다. -->
  <section class="scene scene--hero" id="scene-intro" data-label="인트로">
    <div class="hero">
      <div class="ltf">
        <p class="ltf__text">Welcome to SEN ENGINEERING GROUP</p>
        <span class="ltf__box" data-ltf-box><span class="ltf__sizer" data-ltf-sizer></span></span>
      </div>
      <p class="ltf__lead" data-bind="site.hero.subtitle"></p>
      <div class="flags" data-flags></div>
    </div>
  </section>

  <!-- ---------- 장면 1 : 회사소개 (CEO 인사말) ----------
       예전에는 CEO·연혁·공법·CONTACT 가 이 섹션 하나에 다 들어 있어
       회사소개 혼자 화면 4.7개 분량이었습니다. 넷을 독립 섹션으로 나눠
       각각 자기 리듬(배경·여백·제목 크기)을 갖게 했습니다. -->
  <section class="scene scene--paper scene--opening" id="scene-about" data-label="회사소개">
    <div class="scene__inner">
      <header class="scene__head" data-reveal>
        <p class="scene__kicker" data-bind="about.section.eyebrow"></p>
        <h2 class="scene__title" data-bind="about.section.title"></h2>
        <p class="scene__lead" data-bind="about.section.lead"></p>
      </header>

      <!-- "CEO 인사말" 제목·인용구·본문 글을 모두 지웠습니다 — 영상과,
           그 바로 아래 우측에 놓는 서명(직함·이름)만 남깁니다. -->
      <div class="about-block" id="about-ceo">
        <!-- 영상 위, 센구조연구소→센벡스→센코어테크로 이어지는 계열 구조를
             날짜와 함께 짧게 보여줍니다. 예전 회사연혁(가로 타임라인)
             섹션을 없애면서 그 안의 핵심 이정표 3개만 간추려 옮긴
             것입니다 — content/about.json의 milestones. -->
        <div class="about-milestones" data-list="about.milestones" data-reveal></div>
        <!-- 영상 URL(about.ceo.video)이 비어 있으면 render.js가 이 자리를 통째로 숨기고,
             있으면 자동재생·반복 iframe을 여기에 채워 넣습니다 -->
        <div class="ceo__video" data-ceo-video hidden data-reveal></div>
        <p class="ceo__sign" data-reveal>
          <span class="ceo__role" data-bind="about.ceo.role"></span>
          <strong class="ceo__name" data-bind="about.ceo.name"></strong>
        </p>
      </div>
    </div>
  </section>

  <!-- ---------- 장면 2 : 프로젝트 (실적 지구본) ---------- -->
  <section class="scene scene--paper" id="scene-projects" data-label="프로젝트" data-section="projects">
    <div class="scene__inner">
      <header class="scene__head" data-reveal>
        <h2 class="scene__title" data-bind="projects.section.title"></h2>
        <p class="scene__lead" data-bind="projects.section.lead"></p>
      </header>

      <!-- 국내 / 국외 탭. 아래 시각화가 탭에 따라 지도 ↔ 지구본으로 바뀝니다. -->
      <div class="proj-tabs" role="tablist" data-proj-tabs data-reveal>
        <button type="button" class="proj-tab is-on" role="tab" aria-selected="true"
                data-proj-tab="domestic" data-bind="projects.tabs.domestic">국내</button>
        <button type="button" class="proj-tab" role="tab" aria-selected="false"
                data-proj-tab="overseas" data-bind="projects.tabs.overseas">국외</button>
      </div>

      <dl class="globe__stats" data-globe-stats></dl>

      <!-- 지도/지구본과 카드 패널을 좌우로 배치합니다. 국내는 지도(왼쪽,
           넓게) + 카드 패널(오른쪽, 좁게), 국외는 반대로 카드 패널
           (왼쪽, 좁게) + 지구본(오른쪽, 넓게) — main.js가 탭을 바꿀 때
           .proj-viz에 is-overseas 클래스를 붙여 두 칸의 폭 배정을
           맞바꿉니다(components.css의 .proj-viz.is-overseas 참고).
           네 요소 모두 이 grid의 바로 아래 자식이고, order로 자리를
           잡습니다(.proj-viz__map/.oproj-side는 order:1=왼쪽,
           .pmap-side/두번째 .proj-viz__map은 order:2=오른쪽). -->
      <div class="proj-viz" data-proj-viz>
        <!-- 국내 탭: 실제 지도(MapLibre). 4,576개 현장을 점으로 올려 두고
             확대할수록 뭉친 덩어리가 저절로 갈라집니다 — 팝업으로 한 번
             더 들어갈 필요가 없어져 예전의 시/군/구 드릴다운 팝업은
             없앴습니다. 내용은 assets/js/projectmap.js 가 그립니다. -->
        <div class="proj-viz__map" data-kmap-tab="domestic">
          <div class="pmap" data-pmap>
            <button class="pmap__back" type="button" data-pmap-back data-bind="projects.ui.mapBack" hidden>← 전국으로</button>
            <div class="pmap__canvas" data-pmap-canvas></div>
          </div>
          <div class="pmap__legend">
            <span class="pmap__legend-title" data-bind="projects.ui.mapLegendTitle">시/도별 실적 건수</span>
            <span class="pmap__legend-cap" data-bind="projects.ui.mapLegendMin">적음</span>
            <span class="pmap__legend-bar"></span>
            <span class="pmap__legend-cap" data-pmap-legend-max>—</span>
          </div>
        </div>
        <!-- 국내 탭: 시/도 카드 → 시/군/구 목록 → 프로젝트 목록으로 파고드는
             패널. 내용은 assets/js/projectmap.js가 그리며, 지도 클릭과
             서로 연동됩니다. -->
        <aside class="pmap-side" data-kmap-tab="domestic" data-pmap-side></aside>

        <!-- 국외 탭: 나라 카드 → 연도별 구조설계/안전진단 건수 패널.
             내용은 assets/js/overseasmap.js가 그리며, 카드를 고르면
             지구본도 그 나라 쪽으로 돌아갑니다. -->
        <aside class="pmap-side" data-kmap-tab="overseas" data-oproj-side></aside>
        <!-- 국외 탭: 지구본. 가만히 두면 한국이 정면에서 멈춰 있고,
             드래그만 됩니다. -->
        <div class="proj-viz__map" data-kmap-tab="overseas">
          <div class="globe__stage" data-globe>
            <div class="globe__pills" data-globe-pills aria-hidden="true"></div>
            <div class="globe__tip" data-globe-tip hidden></div>
          </div>
        </div>
      </div>
      <p class="globe__hint" data-globe-hint></p>
    </div>
  </section>

  <!-- ---------- 장면 2.5 : 센코어테크의 역량 ----------
       왼쪽에 총 인원(설립연도는 그 설명 문구 안에 포함)·강구조시공능력
       순위를 흰 카드 두 장으로 세로로 쌓고, 오른쪽에 기준연도 매출액 +
       연도별 매출 곡선 그래프를 큰 카드 하나로 둡니다. 주요 숫자는 모두
       파란색입니다. 순위·기준연도·총 인원(총/센코어테크 소속/협력업체
       소속)·연도별 금액은 Pages CMS의 [⑤ 센코어테크 역량]에서 각각
       입력하면 render.js가 그대로 반영합니다(설명 문구 자체는 고정값
       — content/sencoretech.json). 매출액 큰 숫자와 그 라벨의 연도만
       예외로, 연도별 목록의 "가장 마지막(최신) 항목"에서 그대로
       계산·인용합니다 — 별도 입력칸 없이 항상 그래프의 최신 값과 같은
       숫자를 보여줍니다. 인원·그래프 값은 아직 더미(예시) 데이터입니다
       — content/sencoretech-data.json 참고. -->
  <section class="scene scene--paper" id="scene-sencoretech" data-label="센코어테크">
    <div class="scene__inner">
      <header class="scene__head" data-reveal>
        <h2 class="scene__title" data-bind="sencoretech.section.title"></h2>
        <p class="scene__lead" data-bind="sencoretech.section.lead"></p>
      </header>

      <div class="sct-capability">
        <div class="sct-stats">
          <div class="sct-stat" data-reveal>
            <strong class="sct-stat__value"><span class="sct-stat__prefix" data-sct-rank-prefix></span><span data-bind="sencoretech.rank.current"></span><span class="sct-stat__unit" data-bind="sencoretech.rank.suffix"></span></strong>
            <span class="sct-stat__label" data-sct-rank-label></span>
          </div>
          <div class="sct-stat" data-reveal>
            <strong class="sct-stat__value"><span data-sct-headcount-value></span><span class="sct-stat__unit" data-bind="sencoretech.headcount.unit"></span></strong>
            <span class="sct-stat__label" data-bind="sencoretech.headcount.caption"></span>
            <span class="sct-stat__sublabel" data-sct-headcount-breakdown></span>
          </div>
        </div>

        <div class="sct-revenue" data-reveal>
          <span class="sct-revenue__label" data-sct-revenue-label></span>
          <strong class="sct-revenue__value"><span data-sct-revenue-value></span><span class="sct-revenue__unit" data-bind="sencoretech.yearlyUnit"></span></strong>
          <div class="sct-revenue__chart" data-list="sencoretech.yearly"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ---------- 장면 3 : 주요공법 ---------- -->
  <section class="scene scene--paper" id="scene-methods" data-label="주요공법">
    <div class="scene__inner">
      <div class="methods__head" data-reveal>
        <div>
          <h2 class="scene__title" data-bind="about.methods.heading"></h2>
          <p class="scene__lead" data-bind="about.methods.lead"></p>
        </div>
      </div>
      <div class="scene__scroll"><div class="methods" data-list="about.methods.items" data-reveal></div></div>
    </div>
  </section>

  <!-- ---------- 장면 4 : 뉴스 ----------
       예전엔 카드 여러 장이 한 줄로 계속 흘러가는 마퀴였는데, 카카오톡으로
       받은 참고 컴포넌트(reference/news-animated-testimonials-reference.txt,
       Aceternity의 AnimatedTestimonials)를 참고해 "사진이 살짝 겹쳐
       쌓여있다가 지금 차례인 것만 정면으로 나오는" 스포트라이트로
       바꿨습니다. 이 스포트라이트를 두 개 가로로 나란히 두어 서로 다른
       기사 두 개를 동시에 보여줍니다(data-news-instance="0"/"1" — 실제
       렌더링은 첫 번째에만 하고 controls.js가 두 번째로 그대로
       복제합니다). 시간이 지나면 자동으로 넘어가는 동작은 없고, 가운데
       화살표 한 쌍을 누르면 두 스포트라이트가 함께 한 칸씩 밀립니다.
       분류 칩(카테고리 선택)은 메인 페이지에서 없앴습니다 — 전체 목록
       (news-list.html)에서는 그대로 남아 있습니다. -->
  <section class="scene scene--tint" id="scene-news" data-label="뉴스" data-section="news">
    <div class="scene__inner">
      <div class="news__head" data-reveal>
        <header class="scene__head">
          <h2 class="scene__title" data-bind="site.news.title"></h2>
          <p class="scene__lead" data-bind="site.news.lead"></p>
        </header>
        <a class="news__seeall" href="news-list.html" data-bind="site.ui.loadMore"></a>
      </div>
    </div>
    <div class="news-spotlight-row" data-reveal>
      <div class="news-spotlight" data-news-instance="0">
        <div class="news-spotlight__viewport">
          <div class="cards cards--news" data-list="news.items" data-news-track></div>
        </div>
      </div>
      <div class="news-spotlight" data-news-instance="1">
        <div class="news-spotlight__viewport">
          <div class="cards cards--news" data-news-track></div>
        </div>
      </div>
    </div>
    <div class="news-spotlight__nav">
      <button type="button" class="news-spotlight__arrow" data-news-arrow="prev" aria-label="이전 기사">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12.5 4.5 6 10l6.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="news-spotlight__arrow" data-news-arrow="next" aria-label="다음 기사">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.5 4.5 14 10l-6.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </section>

  <!-- ---------- 장면 5 : 채용 ---------- -->
  <section class="scene scene--paper" id="scene-careers" data-label="채용" data-section="careers">
    <div class="scene__inner">
      <header class="scene__head" data-reveal>
        <h2 class="scene__title" data-bind="site.careers.section.title"></h2>
        <p class="scene__lead" data-bind="site.careers.section.lead"></p>
      </header>
      <h3 class="block__title" data-bind="site.careers.jobsHeading" data-reveal></h3>
      <div class="scene__scroll">
        <div class="jobs" data-list="careers.jobs" data-reveal></div>
      </div>
    </div>
  </section>

  <!-- ---------- 장면 6 : CONTACT ---------- -->
  <section class="scene scene--tint scene--tight scene--closing" id="scene-contact" data-label="CONTACT">
    <div class="scene__inner">
      <header class="scene__head" data-reveal>
        <h2 class="scene__title" data-bind="about.contact.heading"></h2>
      </header>
      <div class="scene__scroll"><div class="offices" data-list="about.contact.offices" data-reveal></div></div>
    </div>
  </section>

</main>

<!-- ============ 지원하기 팝업 ============
     "지원하기" 버튼(위 careers.jobs 카드)을 누르면 뜹니다. 실제 메일 발송은
     서버 없이는 할 수 없어서(공개 저장소에 발송 자격증명을 둘 수 없음),
     "메일 보내기" 버튼이 메일을 대신 열어 줍니다 — PC는 기본 메일 앱이
     없는 경우가 흔해(윈도우) Gmail 웹 작성 화면을 새 탭으로 열고, 모바일은
     mailto: 로 기기의 메일 앱을 엽니다(js/controls.js가 화면 폭으로
     판단). 이 팝업은 그 전에 받는사람·공고명을 한 번 보여주는 확인
     단계입니다. -->
<div class="apply-modal" data-apply-modal hidden>
  <div class="apply-modal__backdrop" data-apply-close></div>
  <div class="apply-modal__panel" role="dialog" aria-modal="true" aria-labelledby="applyModalTitle">
    <button class="apply-modal__close" type="button" data-apply-close aria-label="닫기">&times;</button>
    <p class="apply-modal__eyebrow" data-bind="site.ui.apply">지원하기</p>
    <h3 class="apply-modal__title" id="applyModalTitle" data-apply-job></h3>
    <p class="apply-modal__to">
      <span data-bind="site.ui.applyModalTo">받는사람</span> <strong data-apply-to></strong>
      <button type="button" class="apply-modal__copy" data-apply-copy data-bind="site.ui.applyCopy">주소 복사</button>
    </p>
    <p class="apply-modal__hint" data-bind="site.ui.sendMail">클릭하면 메일 작성 창이 열립니다</p>
    <a class="btn btn--primary apply-modal__send" data-apply-send href="#" data-bind="site.ui.applySend">메일 보내기</a>
    <p class="apply-modal__fallback" data-bind="site.ui.applyFallback">
      메일 앱이 안 열리면 위 주소를 복사해 직접 보내주세요.
    </p>
  </div>
</div>
